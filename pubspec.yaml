name: netflix_clone
description: "Netflix Clone - A streaming app with Arabic and English support"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Navigation
  cupertino_icons: ^1.0.8
  go_router: ^14.2.7
  flutter_staggered_grid_view: ^0.7.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  carousel_slider: ^5.0.0
  
  # State Management
  provider: ^6.1.2
  
  # HTTP & API
  http: ^1.2.2
  dio: ^5.7.0
  
  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_storage: ^12.3.2
  
  # Google Sign In
  google_sign_in: ^6.2.1
  
  # Video Player
  webview_flutter: ^4.9.0
  video_player: ^2.9.1
  
  # Storage & Preferences
  shared_preferences: ^2.3.2
  
  # Internationalization
  intl: ^0.19.0
  
  # Utils
  uuid: ^4.5.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    
  # fonts:
    # - family: Netflix
    #   fonts:
    #     - asset: assets/fonts/NetflixSans-Regular.ttf
    #     - asset: assets/fonts/NetflixSans-Bold.ttf
    #       weight: 700